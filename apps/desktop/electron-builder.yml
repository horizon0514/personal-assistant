appId: com.horizon.akari
productName: Akari
# 版本号与产物名取自 package.json 的 version 字段。
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# 只把构建产物和必要元数据打进包,源码/配置不进包。
# 运行时依赖(@earendil-works/* 等)由 electron-builder 依据 package.json
# 的 dependencies 自动收集(配合根目录 .npmrc 的 node-linker=hoisted)。
files:
  - out/**
  - package.json
  # 显式排除非应用内容,别让它们漏进 asar:
  # - release/ 是构建产物目录,旧版本的整个 .app/dmg(几百 MB)会被套娃打进新包——这是体积大头。
  # - src/ 源码、配置、sourcemap 都不该进运行时包。
  - "!release/**"
  - "!src/**"
  - "!**/*.map"
  - "!{tsconfig*.json,*.config.ts,*.config.js,electron-builder.yml,.env*}"
  # 注:@pa/* 工作区包不在 dependencies(放 devDependencies)——它们被 electron-vite 打进 out/,
  # 不是运行时依赖。electron-builder 只收生产依赖,故不会顺其符号链接走到 apps/desktop 之外。
  # liteparse 主包自带一份 linux 预编译产物(~20MB)作开发回退;生产真正用的是平台 optional 包
  # (@llamaindex/liteparse-<platform>,native loader 优先 require 它)。把主包里这两份冗余二进制剔除,省体积。
  - "!**/node_modules/@llamaindex/liteparse/liteparse.*.node"
  - "!**/node_modules/@llamaindex/liteparse/libpdfium.*"
  # 没用的 provider SDK(~52MB):pi-ai 支持多家,但本应用只用 deepseek(走 openai-completions,
  # 故 openai 包要留)。其余 provider 都是 lazy 动态 import、deepseek 永不触发 → 排除。@smithy 是 @aws-sdk 专用传递依赖。
  - "!**/node_modules/@mistralai/**"
  - "!**/node_modules/@google/genai/**"
  - "!**/node_modules/@anthropic-ai/**"
  - "!**/node_modules/@aws-sdk/**"
  - "!**/node_modules/@smithy/**"
  # OCR 栈(PaddleOCR)整坨外置、不随包(~90–100MB):onnxruntime-node(~65MB)+ @napi-rs/canvas(原生)
  # + @techstark/opencv-js(wasm)+ ppu-ocv/ppu-paddle-ocr 胶水。首个扫描件触发时按平台从 Release 下载到
  # <userData>/ocr-runtime/<ver>,由 cap-document 动态加载(见 packages/cap-document)。把 app 首装包瘦掉这一坨。
  - "!**/node_modules/onnxruntime-node/**"
  - "!**/node_modules/onnxruntime-common/**"
  - "!**/node_modules/ppu-paddle-ocr/**"
  - "!**/node_modules/ppu-ocv/**"
  - "!**/node_modules/@napi-rs/canvas*/**"
  - "!**/node_modules/@techstark/opencv-js/**"

# 随包内置 Skill:repo 根的 skills/(在 apps/desktop 之外)放到 resources/skills,
# 启动时由 seed-skills 播种进 <userData>/skills(见 apps/desktop/src/main/seed-skills.ts)。
# 排除 node_modules(运行时另装,见 skill-runtime)与 .models(模型权重缓存,不随包)。
extraResources:
  - from: ../../skills
    to: skills
    filter:
      - "**/*"
      - "!**/node_modules/**"
      - "!**/.models/**"

# 原生模块解包:无法从 app.asar 内 dlopen 的原生库必须解包到 app.asar.unpacked。
# - liteparse:.node(napi) + libpdfium 动态库(主包 + 各平台 optional 包)。
#   (onnxruntime-node 已外置、不在包内,故无需在此解包。)
asarUnpack:
  - "**/node_modules/@llamaindex/liteparse*/**"

directories:
  output: release/${version}
  buildResources: build

# 未提供图标时使用 Electron 默认图标;放置 build/icon.icns 与 build/icon.ico 即可自动启用。

mac:
  category: public.app-category.productivity
  # OCR 栈已整坨外置(见上 files 排除),不再随包,故无需在此做 onnxruntime 的平台裁剪。
  # 注意:外置运行时的 darwin 只有 arm64,没有 x64 —— Intel Mac(x64)拉不到对应附件,
  # 扫描件 OCR 会优雅降级回"抽不出"(不崩)。若要支持 Intel Mac 需另产 x64 运行时包。
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # 签名预留:CI 注入 CSC_LINK / CSC_KEY_PASSWORD 后自动签名;
  # 未注入证书时 electron-builder 退化为 ad-hoc 签名(本地可运行,分发会有 Gatekeeper 提示)。
  # 公证预留:配置 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 后将 notarize 改为 true。
  notarize: false
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  # OCR 栈已整坨外置(见上 files 排除),不随包。
  target:
    - target: nsis
      arch:
        - x64
  # 签名预留:CI 注入 CSC_LINK / CSC_KEY_PASSWORD 后自动签名。

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# 仅当显式 --publish 时上传;Release workflow 走 GitHub Releases。
# releaseType: release —— 直接发正式版(默认 draft 会建成草稿,需手动 Publish)。
publish:
  provider: github
  owner: horizon0514
  repo: personal-assistant
  releaseType: release
