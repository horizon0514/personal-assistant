name: Release

on:
  push:
    tags:
      - "v*"

# 需要写权限以创建 Release 并上传产物。
permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先构建所有 workspace 包(含 @pa/desktop 的 electron-vite build)。
      - name: Build
        run: pnpm -r build

      # 代码签名预留:只有配置了对应 Secret 才注入环境变量。
      # 关键 —— 不能把空的 CSC_LINK 传给 electron-builder,否则它会把空串当成
      # 证书文件路径去解析(落到工作目录)而报 "not a file";未配置时应让其
      # 走自动发现 → 找不到证书 → 跳过签名(ad-hoc),与本地行为一致。
      - name: Configure code signing (optional)
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "code signing: enabled"
          else
            echo "code signing: none (unsigned / ad-hoc)"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi

      # 由 electron-builder 打包并发布到 GitHub Release(草稿)。
      - name: Package & publish
        run: pnpm --filter @pa/desktop exec electron-builder --publish always
        env:
          # GitHub Release 上传凭证(自动注入,无需手动配置)。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # OCR 原生运行时(PaddleOCR 栈)不随 app 包,改为按平台单独产出、随 Release 分发,
      # 由 app 首个扫描件触发时按需下载(见 packages/cap-document)。
      # 在干净临时目录里 npm 安装 OCR 闭包(npm 扁平 node_modules + 平台 optional 二进制),打成 tar.gz。
      # 注:版本须与 pnpm-lock.yaml 对齐(ppu-paddle-ocr 5.8.3 / onnxruntime-node 1.26.0);
      # onnxruntime-node 的 napi 版本须与 Electron 的 Node ABI 兼容(napi 向后兼容,当前 napi-v6 OK)。
      - name: Build & upload OCR runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # runner.os/arch → node 的 process.platform/arch(app 据此拼下载文件名)。
          case "${{ runner.os }}" in
            macOS) NODE_PLATFORM=darwin ;;
            Windows) NODE_PLATFORM=win32 ;;
            Linux) NODE_PLATFORM=linux ;;
          esac
          case "${{ runner.arch }}" in
            X64) NODE_ARCH=x64 ;;
            ARM64) NODE_ARCH=arm64 ;;
          esac
          ASSET="ocr-runtime-${NODE_PLATFORM}-${NODE_ARCH}.tar.gz"

          RT="${RUNNER_TEMP}/ocr-rt"
          rm -rf "$RT"; mkdir -p "$RT"
          ( cd "$RT" && npm init -y >/dev/null \
            && npm install --no-audit --no-fund --omit=dev \
                 ppu-paddle-ocr@5.8.3 onnxruntime-node@1.26.0 )

          # 顶层即 node_modules/(app 解压到 <userData>/ocr-runtime/<ver> 后,createRequire 锚在此解析)。
          tar -czf "$ASSET" -C "$RT" node_modules
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber

      # 脚本 Skill 共享运行时(@huggingface/transformers + 平台原生 onnxruntime)不随 app 包,
      # 同 OCR:按平台产出 tar.gz 随 Release 分发,用户首个脚本 Skill 触发时按需下载解压
      # (见 apps/desktop/src/main/skill-runtime.ts)。依赖集须与 SKILL_RUNTIME_DEPS 对齐(@huggingface/transformers 4.2.0),改依赖两处同步。
      - name: Build & upload Skill runtime
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS) NODE_PLATFORM=darwin ;;
            Windows) NODE_PLATFORM=win32 ;;
            Linux) NODE_PLATFORM=linux ;;
          esac
          case "${{ runner.arch }}" in
            X64) NODE_ARCH=x64 ;;
            ARM64) NODE_ARCH=arm64 ;;
          esac
          ASSET="skill-runtime-${NODE_PLATFORM}-${NODE_ARCH}.tar.gz"

          RT="${RUNNER_TEMP}/skill-rt"
          rm -rf "$RT"; mkdir -p "$RT"
          ( cd "$RT" && npm init -y >/dev/null \
            && npm install --no-audit --no-fund --omit=dev \
                 @huggingface/transformers@4.2.0 )

          # 顶层即 node_modules/(app 解压到 <userData>/skill-runtime/<depsHash> 后,skills 根符号链接指向它)。
          tar -czf "$ASSET" -C "$RT" node_modules
          gh release upload "${{ github.ref_name }}" "$ASSET" --clobber
